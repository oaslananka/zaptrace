minimum_pre_commit_version: "4.2.0"
default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.mcp-ai-san\.lock$'
      - id: end-of-file-fixer
        exclude: '(?:\.mcp-ai-san\.lock$|^tests/corpus/fuzz/seeds/kicad-standalone-backslash\.kicad_sch$)'
      - id: check-yaml
        exclude: '^\.mcp/templates/'
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.mcp-ai-san\.lock$'
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/semgrep/semgrep
    rev: v1.170.0
    hooks:
      - id: semgrep
        args: [--config=.semgrep.yml, --error, --metrics=off]

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        args: [--min-severity=medium, --collect=workflows, --strict-collection]
