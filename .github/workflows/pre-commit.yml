name: Pre-commit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hooks:
    name: Repository hooks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "0.11"

      - name: Run pre-commit hooks on changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_REF="$PR_BASE_SHA"
          else
            BASE_REF="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$BASE_REF" || "$BASE_REF" =~ ^0+$ ]]; then
            BASE_REF="$(git rev-list --max-parents=0 HEAD)"
          fi
          # renovate: datasource=pypi depName=pre-commit
          uvx --no-build --from pre-commit==4.6.0 pre-commit run \
            --from-ref "$BASE_REF" \
            --to-ref HEAD \
            --show-diff-on-failure

      - name: Audit all GitHub Actions workflows
        run: |
          uvx --no-build --from pre-commit==4.6.0 pre-commit run actionlint --all-files --show-diff-on-failure
          uvx --no-build --from pre-commit==4.6.0 pre-commit run zizmor --all-files --show-diff-on-failure
