name: Auto assign incoming issues and PRs

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  assign:
    if: github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Assign to oaslananka
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          if gh api "/repos/$REPO/issues/$NUMBER" --jq '.assignees[].login' | grep -Fxq oaslananka; then
            echo "Already assigned to oaslananka"
          else
            gh api --method POST "/repos/$REPO/issues/$NUMBER/assignees" -f assignees[]=oaslananka
          fi
