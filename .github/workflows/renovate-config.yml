name: Renovate Config

on:
  pull_request:
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate-config.yml"
      - ".github/renovate-validation/package.json"
      - ".github/renovate-validation/package-lock.json"
  push:
    branches:
      - main
      - renovate/reconfigure
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate-config.yml"
      - ".github/renovate-validation/package.json"
      - ".github/renovate-validation/package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate-config-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Strict config validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.11.0"

      - name: Install locked Renovate CLI
        working-directory: .github/renovate-validation
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Renovate configuration
        run: .github/renovate-validation/node_modules/.bin/renovate-config-validator --strict
