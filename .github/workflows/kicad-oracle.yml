name: KiCad Oracle

on:
  push:
    branches: [main]
    paths:
      - "zaptrace/export/kicad.py"
      - "zaptrace/export/capabilities.py"
      - "zaptrace/export/evidence.py"
      - "zaptrace/proof/manifest.py"
      - "scripts/ci_kicad_oracle.py"
      - "scripts/ci_kicad_jobset_oracle.py"
      - "tests/test_ci_kicad_jobset_oracle.py"
      - "benchmarks/*/golden/*.kicad_*"
      - "examples/**"
  pull_request:
    branches: [main]
    paths:
      - "zaptrace/export/kicad.py"
      - "zaptrace/export/capabilities.py"
      - "zaptrace/export/evidence.py"
      - "zaptrace/proof/manifest.py"
      - "scripts/ci_kicad_oracle.py"
      - "scripts/ci_kicad_jobset_oracle.py"
      - "tests/test_ci_kicad_jobset_oracle.py"
      - "benchmarks/*/golden/*.kicad_*"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11"
  PYTHONPATH: "."
  ZAPTRACE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Run KiCad oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up locked Python validation environment
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run shared KiCad oracle checks
        uses: ./.github/actions/kicad-oracle
        with:
          record-availability: "true"
          run-jobset: "true"

      - name: Upload KiCad oracle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kicad-oracle-evidence
          path: |
            kicad-oracle-check.json
            kicad-oracle-summary.json
            kicad-jobset-oracle-summary.json
            kicad-review-exports/
          if-no-files-found: error
