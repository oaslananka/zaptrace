name: KiCad Oracle

on:
  push:
    branches: [main]
    paths:
      - "zaptrace/export/kicad.py"
      - "zaptrace/export/capabilities.py"
      - "zaptrace/export/evidence.py"
      - "zaptrace/proof/manifest.py"
      - "scripts/ci_kicad_oracle.py"
      - "scripts/ci_kicad_jobset_oracle.py"
      - "tests/test_ci_kicad_jobset_oracle.py"
      - "benchmarks/*/golden/*.kicad_*"
      - "examples/**"
  pull_request:
    branches: [main]
    paths:
      - "zaptrace/export/kicad.py"
      - "zaptrace/export/capabilities.py"
      - "zaptrace/export/evidence.py"
      - "zaptrace/proof/manifest.py"
      - "scripts/ci_kicad_oracle.py"
      - "scripts/ci_kicad_jobset_oracle.py"
      - "tests/test_ci_kicad_jobset_oracle.py"
      - "benchmarks/*/golden/*.kicad_*"
      - "examples/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11"
  PYTHONPATH: "."
  ZAPTRACE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    name: Run KiCad oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv lock --check && uv sync --locked --all-extras --all-groups --no-install-project --no-build

      - name: Install KiCad 10 CLI
        run: |
          bash scripts/ci_install_kicad.sh kicad

      - name: Run focused oracle checks
        run: .venv/bin/python scripts/ci_kicad_oracle.py --strict-skips --output kicad-oracle-summary.json

      - name: Run atomic KiCad 10 jobset oracle
        run: .venv/bin/python scripts/ci_kicad_jobset_oracle.py --output kicad-jobset-oracle-summary.json

      - name: Upload KiCad oracle evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kicad-oracle-evidence
          path: |
            kicad-oracle-check.json
            kicad-oracle-summary.json
            kicad-jobset-oracle-summary.json
            kicad-review-exports/
          if-no-files-found: error
