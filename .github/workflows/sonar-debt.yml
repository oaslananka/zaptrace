name: Sonar Historical Debt

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Capture evidence or enforce the committed ratchet
        required: true
        type: choice
        default: check
        options:
          - capture
          - check
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 0"

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11"

permissions:
  contents: read

concurrency:
  group: sonar-historical-debt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv lock --check && uv sync --locked --all-extras --all-groups --no-install-project --no-build

      - name: Capture and enforce historical debt evidence
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          mode="${DISPATCH_MODE:-check}"
          expected_args=()
          if [[ "${{ github.event_name }}" == "push" ]]; then
            expected_args=(
              --expected-analysis-revision "$GITHUB_SHA"
              --analysis-attempts 30
              --analysis-poll-seconds 10
            )
          fi
          .venv/bin/python scripts/ci_sonar_debt.py "$mode" \
            --trusted-output-root . \
            --output artifacts/sonar-debt/sonar-debt-report.json \
            --markdown artifacts/sonar-debt/sonar-debt-report.md \
            "${expected_args[@]}"
          cat artifacts/sonar-debt/sonar-debt-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Sonar debt evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-debt-${{ github.run_id }}
          path: artifacts/sonar-debt/
          if-no-files-found: error
          retention-days: 30
