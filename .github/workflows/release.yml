  # GHCR publishing remains intentionally disabled until registry ownership and support policy are completed.

  github-release:
    name: Create GitHub release
    if: github.event_name == 'push'
    needs: [python-distributions, rust-wheels, container-security, pypi-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Download tagged release evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: tagged-release-evidence
          path: release-artifacts

      - name: Download release version consistency evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: version-consistency-release
          path: release-artifacts

      - name: Download release Cargo advisory evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: cargo-audit-release
          path: release-artifacts

      - name: Download container reproducibility and scan evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: container-security-evidence
          path: release-artifacts/container-security

      - name: Download Python distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-distributions
          path: release-artifacts

      - name: Download Rust wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheel-*
          path: release-artifacts
          merge-multiple: true

      - name: Download native boundary evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: native-boundary-*
          path: release-artifacts
          merge-multiple: true

      - name: Download distribution clean-install evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: distribution-smoke-*
          path: release-artifacts/distribution
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          path: release-artifacts
          artifact-name: zaptrace-${{ github.ref_name }}.spdx.json
          output-file: release-artifacts/zaptrace-${{ github.ref_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate checksum manifest
        run: python scripts/generate_checksum_manifest.py release-artifacts --output release-artifacts/SHA256SUMS

      - name: Verify checksum manifest
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: release-artifacts/**/*

      - name: Create GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          generate_release_notes: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: release-artifacts/**/*
