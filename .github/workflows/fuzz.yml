name: Fuzz

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 4 * * 0"  # Weekly deep campaign, Sunday 04:15 UTC
  workflow_dispatch:
    inputs:
      profile:
        description: Campaign profile
        required: false
        default: deep
        type: choice
        options:
          - ci
          - deep

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11"
  PYTHONPATH: "."

jobs:
  campaign:
    name: Bounded untrusted-input campaign
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install test dependencies
        run: uv lock --check && uv sync --locked --all-extras --group test --no-install-project --no-build

      - name: Resolve campaign profile
        id: profile
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_PROFILE: ${{ inputs.profile }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            echo "value=deep" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$DISPATCH_PROFILE" ]; then
            echo "value=$DISPATCH_PROFILE" >> "$GITHUB_OUTPUT"
          else
            echo "value=ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Run deterministic fuzz campaign
        env:
          CAMPAIGN_PROFILE: ${{ steps.profile.outputs.value }}
        run: |
          .venv/bin/python scripts/ci_fuzz_campaign.py \
            --profile "$CAMPAIGN_PROFILE" \
            --seed 8201

      - name: Upload campaign evidence and failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: fuzz-campaign-${{ steps.profile.outputs.value }}
          path: |
            artifacts/fuzz/campaign.json
            artifacts/fuzz/fuzz-failures/
          if-no-files-found: warn
          retention-days: 30
