name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  changes:
    name: Security change classification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      python_audit_required: ${{ steps.classify.outputs.python_audit_required }}
      rust_audit_required: ${{ steps.classify.outputs.rust_audit_required }}
      sast_required: ${{ steps.classify.outputs.sast_required }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: classify
        name: Classify security-sensitive changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            {
              echo "python_audit_required=true"
              echo "rust_audit_required=true"
              echo "sast_required=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" > changed-files.txt
          elif [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
            {
              echo "python_audit_required=true"
              echo "rust_audit_required=true"
              echo "sast_required=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          else
            git diff --name-only "$PUSH_BEFORE_SHA" HEAD > changed-files.txt
          fi

          python_audit_required=false
          rust_audit_required=false
          sast_required=false

          while IFS= read -r path; do
            case "$path" in
              pyproject.toml|uv.lock|requirements/*.txt|.github/workflows/security-scan.yml)
                python_audit_required=true
                ;;
            esac
            case "$path" in
              zaptrace_core/Cargo.toml|zaptrace_core/Cargo.lock|scripts/ci_cargo_audit.py|.github/workflows/security-scan.yml)
                rust_audit_required=true
                ;;
            esac
            case "$path" in
              zaptrace/*.py|zaptrace_core/src/*.rs|scripts/*.py|tests/*.py|.semgrep.yml|.github/workflows/security-scan.yml)
                sast_required=true
                ;;
            esac
          done < changed-files.txt

          {
            echo "python_audit_required=$python_audit_required"
            echo "rust_audit_required=$rust_audit_required"
            echo "sast_required=$sast_required"
          } >> "$GITHUB_OUTPUT"

  audit:
    needs: changes
    if: needs.changes.outputs.python_audit_required == 'true'
    permissions:
      contents: read
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv lock --check && uv sync --locked --all-extras --all-groups --no-install-project --no-build

      - name: Run uv audit
        run: uv audit

  cargo-audit:
    needs: changes
    if: needs.changes.outputs.rust_audit_required == 'true'
    permissions:
      contents: read
    name: Cargo advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked

      - name: Run Cargo advisory audit
        id: cargo_audit
        shell: bash
        run: |
          set +e
          cargo audit --file zaptrace_core/Cargo.lock --json > cargo-audit.json
          audit_exit=$?
          python3 scripts/ci_cargo_audit.py \
            --workspace-root "$GITHUB_WORKSPACE" \
            --input cargo-audit.json \
            --lockfile zaptrace_core/Cargo.lock \
            --tool-version "$(cargo-audit --version)" \
            --output cargo-audit-evidence.json \
            --markdown cargo-audit-evidence.md \
            --strict
          evidence_exit=$?
          set -e
          cat cargo-audit-evidence.md >> "$GITHUB_STEP_SUMMARY"
          if [[ "$audit_exit" -ne 0 || "$evidence_exit" -ne 0 ]]; then
            exit 1
          fi

      - name: Upload Cargo advisory evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cargo-audit-evidence
          path: |
            cargo-audit.json
            cargo-audit-evidence.json
            cargo-audit-evidence.md
          if-no-files-found: error

  semgrep:
    needs: changes
    if: needs.changes.outputs.sast_required == 'true'
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Run Semgrep
        run: uvx --no-build --from semgrep==1.170.0 semgrep scan --config .semgrep.yml --error --metrics=off --sarif --output semgrep-results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep
        if: always()

  codeql:
    needs: changes
    if: needs.changes.outputs.sast_required == 'true'
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.2.2
        with:
          languages: python

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a  # v4.2.2

  security-gate:
    permissions: {}
    name: Security gate
    needs: [changes, audit, cargo-audit, semgrep, codeql]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce applicable security job results
        shell: bash
        env:
          CHANGE_RESULT: ${{ needs.changes.result }}
          PYTHON_AUDIT_REQUIRED: ${{ needs.changes.outputs.python_audit_required }}
          RUST_AUDIT_REQUIRED: ${{ needs.changes.outputs.rust_audit_required }}
          SAST_REQUIRED: ${{ needs.changes.outputs.sast_required }}
          AUDIT_RESULT: ${{ needs.audit.result }}
          CARGO_AUDIT_RESULT: ${{ needs.cargo-audit.result }}
          SEMGREP_RESULT: ${{ needs.semgrep.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          set -euo pipefail
          if [[ "$CHANGE_RESULT" != "success" ]]; then
            echo "Security change classification failed: $CHANGE_RESULT" >&2
            exit 1
          fi

          failures=()
          check_job() {
            local required="$1"
            local result="$2"
            local label="$3"
            if [[ "$required" == "true" ]]; then
              [[ "$result" == "success" ]] || failures+=("$label=$result")
            elif [[ "$result" != "skipped" && "$result" != "success" ]]; then
              failures+=("$label=$result")
            fi
          }

          check_job "$PYTHON_AUDIT_REQUIRED" "$AUDIT_RESULT" "dependency-audit"
          check_job "$RUST_AUDIT_REQUIRED" "$CARGO_AUDIT_RESULT" "cargo-audit"
          check_job "$SAST_REQUIRED" "$SEMGREP_RESULT" "semgrep"
          check_job "$SAST_REQUIRED" "$CODEQL_RESULT" "codeql"

          if (( ${#failures[@]} > 0 )); then
            printf 'Security gate failures: %s\n' "${failures[*]}" >&2
            exit 1
          fi

          echo "Security gate passed (python_audit=$PYTHON_AUDIT_REQUIRED, rust_audit=$RUST_AUDIT_REQUIRED, sast=$SAST_REQUIRED)."
