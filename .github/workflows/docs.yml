name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "config/public-facts.json"
      - "scripts/ci_docs_status_sync.py"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "config/public-facts.json"
      - "scripts/ci_docs_status_sync.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.capture_sha.outputs.sha }}
      docs_status_passed: ${{ steps.docs_status.outputs.passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Capture source SHA
        id: capture_sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building documentation from commit $sha"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Validate docs/status sync
        id: docs_status
        run: |
          uv run --no-project python scripts/ci_docs_status_sync.py --output docs-status.json
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Build documentation
        run: |
          uvx --no-build --from mkdocs-material==9.6.21 mkdocs build --strict

      - name: Embed deployment provenance
        run: |
          sha="${{ steps.capture_sha.outputs.sha }}"
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > site/deployment-provenance.json <<EOF
          {
            "source_sha": "$sha",
            "deployment_timestamp": "$timestamp",
            "workflow_run_id": "${{ github.run_id }}",
            "workflow_run_number": "${{ github.run_number }}"
          }
          EOF
          echo "Deployment provenance written to site/deployment-provenance.json"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.docs_status_passed == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  freshness-check:
    name: Post-deploy freshness verification
    runs-on: ubuntu-24.04
    needs: [build, deploy]
    if: github.event_name == 'push' && needs.build.outputs.docs_status_passed == 'true'
    permissions:
      contents: read
    steps:
      - name: Wait for deployment to propagate
        run: sleep 10

      - name: Fetch deployed provenance
        id: fetch_provenance
        run: |
          url="https://oaslananka.github.io/zaptrace/deployment-provenance.json"
          echo "Fetching deployment provenance from $url"
          for attempt in {1..6}; do
            if response=$(curl -sf "$url" 2>/dev/null); then
              echo "$response" > deployed-provenance.json
              echo "provenance_fetched=true" >> "$GITHUB_OUTPUT"
              break
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          if [[ ! -f deployed-provenance.json ]]; then
            echo "Failed to fetch deployment provenance after 6 attempts"
            exit 1
          fi

      - name: Verify deployment freshness
        run: |
          expected_sha="${{ needs.build.outputs.source_sha }}"
          deployed_sha=$(jq -r '.source_sha' deployed-provenance.json)
          deployed_ts=$(jq -r '.deployment_timestamp' deployed-provenance.json)
          echo "Expected source SHA: $expected_sha"
          echo "Deployed source SHA: $deployed_sha"
          echo "Deployment timestamp: $deployed_ts"

          if [[ "$deployed_sha" != "$expected_sha" ]]; then
            echo "::error::FRESHNESS CHECK FAILED: Deployed documentation (${deployed_sha:0:8}) does not match expected revision (${expected_sha:0:8})"
            echo "This indicates the GitHub Pages deployment is stale or was built from a different commit."
            exit 1
          fi

          echo "::notice::Freshness check passed: Deployed documentation matches expected revision ${expected_sha:0:8}"

      - name: Update public-facts with deployment info
        if: success()
        run: |
          # This step documents the successful deployment for reference
          # The actual public-facts.json update would be done via a separate PR or automated process
          sha="${{ needs.build.outputs.source_sha }}"
          timestamp=$(jq -r '.deployment_timestamp' deployed-provenance.json)
          echo "Documentation successfully deployed from $sha at $timestamp"
          echo "deployment_sha=$sha" >> "$GITHUB_OUTPUT"
          echo "deployment_timestamp=$timestamp" >> "$GITHUB_OUTPUT"