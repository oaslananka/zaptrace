name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "config/public-facts.json"
      - "scripts/ci_docs_status_sync.py"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
      - "config/public-facts.json"
      - "scripts/ci_docs_status_sync.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.capture_sha.outputs.sha }}
      docs_status_passed: ${{ steps.docs_status.outputs.passed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Capture source SHA
        id: capture_sha
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building documentation from commit $sha"

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Validate docs/status sync
        id: docs_status
        run: |
          python3 scripts/ci_docs_status_sync.py --output docs-status.json
          echo "passed=true" >> "$GITHUB_OUTPUT"

      - name: Build documentation
        run: |
          uvx --no-build --from mkdocs-material==9.6.21 mkdocs build --strict

      - name: Embed deployment provenance
        env:
          SOURCE_SHA: ${{ steps.capture_sha.outputs.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          timestamp=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          cat > site/deployment-provenance.json <<EOF
          {
            "source_sha": "$SOURCE_SHA",
            "deployment_timestamp": "$timestamp",
            "workflow_run_id": "$RUN_ID",
            "workflow_run_number": "$RUN_NUMBER"
          }
          EOF
          echo "Deployment provenance written to site/deployment-provenance.json"

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: build
    if: github.event_name == 'push' && needs.build.outputs.docs_status_passed == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4

  freshness-check:
    name: Post-deploy freshness verification
    runs-on: ubuntu-24.04
    needs: [build, deploy]
    if: github.event_name == 'push' && needs.build.outputs.docs_status_passed == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Verify deployment freshness with robust backoff
        env:
          EXPECTED_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python3 scripts/ci_docs_status_sync.py \
            --verify-freshness \
            --expected-sha "$EXPECTED_SHA" \
            --output deployed-provenance.json
