    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv lock --check && uv sync --locked --all-extras --all-groups --no-install-project --no-build

      - name: Check MCP tools reference is up to date
        run: .venv/bin/python scripts/generate_mcp_docs.py --check

      - name: Check docs status-sync guard
        run: |
          .venv/bin/python scripts/ci_docs_status_sync.py \
            --output docs-status-sync.json

      - name: Upload docs status-sync report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-status-sync
          path: docs-status-sync.json

      - name: Check evidence identity policy
        run: |
          .venv/bin/python scripts/ci_evidence_identity.py \
            --output evidence-identity-policy.json \
            --strict

      - name: Upload evidence identity policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-identity-policy
          path: evidence-identity-policy.json
          if-no-files-found: error

      - name: Check JSON Schema matches generated
        run: |
          .venv/bin/python -c "
          from zaptrace.core.parser import generate_json_schema, write_json_schema
          import json, sys
          from pathlib import Path
          generated = generate_json_schema()
          committed = json.loads(Path('docs/schemas/design-v1.json').read_text(encoding='utf-8'))
          if generated != committed:
              print('ERROR: docs/schemas/design-v1.json is stale. Run write_json_schema() to regenerate.')
              sys.exit(1)
          print('OK: JSON Schema is up to date')
          "

  release-gate-summary:
    name: Release gate summary
    runs-on: ubuntu-latest
    needs: [changes, validation-environment, lint, mcp-compatibility, test-lane-policy, test, test-compatibility, coverage, rust, build, docs-stale, benchmark-001, generated-board-release-gate, kicad-oracle, docker-image-smoke]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv lock --check && uv sync --locked --all-extras --all-groups --no-install-project --no-build

      - name: Generate snapshot gate summary
        run: |
          .venv/bin/python scripts/ci_release_gate.py \
            --mode snapshot \
            --gate "validation-environment=${{ needs.validation-environment.result }}" \
            --gate "lint=${{ needs.lint.result }}" \
            --gate "mcp-compatibility=${{ needs.mcp-compatibility.result }}" \
            --gate "test-lane-policy=${{ needs.test-lane-policy.result }}" \
            --gate "tests=${{ needs.test.result }}" \
            --gate "test-compatibility=${{ needs.test-compatibility.result }}" \
            --gate "coverage=${{ needs.coverage.result }}" \
            --gate "rust=${{ needs.rust.result }}" \
            --gate "build=${{ needs.build.result }}" \
            --gate "docs-stale=${{ needs.docs-stale.result }}" \
            --gate "benchmark-001=${{ needs.benchmark-001.result }}" \
            --gate "generated-board-release-gate=${{ needs.generated-board-release-gate.result }}" \
            --gate "kicad-oracle=${{ needs.kicad-oracle.result }}" \
            --gate "docker-image-smoke=${{ needs.docker-image-smoke.result }}" \
            --required-oracle "kicad-oracle" \
            --output snapshot-gate-summary.json \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --strict

      - name: Upload release gate summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snapshot-gate-summary
          path: snapshot-gate-summary.json
