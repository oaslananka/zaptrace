name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 1 * * *"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.11"
  PYTHONPATH: "."

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      full_ci: ${{ steps.classify.outputs.full_ci }}
      full_matrix: ${{ steps.classify.outputs.full_matrix }}
      heavy_ci: ${{ steps.classify.outputs.heavy_ci }}
      test_mode: ${{ steps.classify.outputs.test_mode }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: classify
        name: Classify changed paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_file_list="changed-files.txt"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_file_list"
          else
            printf '%s\n' "__non_pr__" > "$changed_file_list"
          fi
          python scripts/ci_change_policy.py \
            --event "$EVENT_NAME" \
            --changed-files "$changed_file_list" \
            --github-output "$GITHUB_OUTPUT" \
            --summary "$GITHUB_STEP_SUMMARY"

  validation-environment:
    name: Validation environment parity
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip heavyweight validation for non-heavy PR
        if: needs.changes.outputs.heavy_ci != 'true'
        run: |
          echo "Non-heavy PR; skipping validation environment parity."
          echo "Non-heavy PR; validation environment parity skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
        if: needs.changes.outputs.heavy_ci == 'true'

      - name: Install uv
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39  # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}

      - name: Install KiCad 10 CLI
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          bash scripts/ci_install_kicad.sh kicad ngspice

      - name: Set up Python
        if: needs.changes.outputs.heavy_ci == 'true'
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install locked identity dependencies
        if: needs.changes.outputs.heavy_ci == 'true'
        run: uv lock --check && uv sync --locked --all-extras --all-groups --no-install-project --no-build

      - name: Run validation environment gate
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_validation_environment.py \
            --role authoritative-release \
            --strict \
            --output validation-environment.json

      - name: Upload validation environment report
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: validation-environment
          path: validation-environment.json


  distribution-clean-install:
    name: Distribution clean-install
    needs: changes
    uses: ./.github/workflows/quality-distribution.yml
    with:
      heavy_ci: ${{ needs.changes.outputs.heavy_ci }}

  lint:
    name: Lint & Typecheck
    needs: changes
    uses: ./.github/workflows/quality-lint.yml
    with:
      full_ci: ${{ needs.changes.outputs.full_ci }}

  mcp-compatibility:
    name: MCP compatibility contract
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip MCP compatibility for docs-only PR
        if: needs.changes.outputs.full_ci != 'true'
        run: |
          echo "Docs-only PR; skipping MCP compatibility contract."
          echo "Docs-only PR; MCP compatibility contract skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
        if: needs.changes.outputs.full_ci == 'true'

      - name: Set up locked Python dependencies
        if: needs.changes.outputs.full_ci == 'true'
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run MCP dependency and transport contracts
        if: needs.changes.outputs.full_ci == 'true'
        run: |
          .venv/bin/pytest -q \
            tests/test_mcp_dependency_contract.py \
            tests/test_mcp_server.py \
            tests/test_network_transport_security.py

      - name: Generate MCP dependency evidence
        if: needs.changes.outputs.full_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_dependency_evidence.py \
            --output mcp-dependency-evidence.json \
            --strict

      - name: Upload MCP dependency evidence
        if: needs.changes.outputs.full_ci == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: mcp-dependency-evidence
          path: mcp-dependency-evidence.json
          if-no-files-found: error

  test-lane-policy:
    name: Test lane policy
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up locked Python dependencies
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate lane policy and shard inventory
        run: |
          .venv/bin/python scripts/ci_test_lane_policy.py \
            --output test-lane-inventory.json \
            --strict
          .venv/bin/pytest -p tests.lane_policy \
            --collect-only \
            --lane "all" \
            --lane-report test-lane-collection.json

      - name: Upload test lane inventory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-lane-inventory
          path: |
            test-lane-inventory.json
            test-lane-collection.json
          if-no-files-found: error

  test:
    name: Python test lanes
    needs: [changes, test-lane-policy]
    uses: ./.github/workflows/quality-test-lanes.yml
    with:
      test_mode: ${{ needs.changes.outputs.test_mode }}

  test-compatibility:
    name: Fast compatibility (Python ${{ matrix.python-version }})
    needs: [changes, test-lane-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Skip compatibility lanes for docs-only PR
        if: needs.changes.outputs.test_mode == 'docs'
        run: echo "Docs-only PR; Python compatibility lanes skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        if: needs.changes.outputs.test_mode != 'docs'
        with:
          persist-credentials: false

      - name: Set up locked Python matrix
        if: needs.changes.outputs.test_mode != 'docs'
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          sync-explicit-python: "true"

      - name: Run fast compatibility lanes
        if: needs.changes.outputs.test_mode != 'docs'
        shell: bash
        run: |
          set -euo pipefail
          for lane in unit integration; do
            .venv/bin/pytest -p tests.lane_policy \
              --lane "$lane" \
              --enforce-lane-budget \
              --lane-report "test-lane-${lane}-${{ matrix.python-version }}.json" \
              --junitxml "junit-${lane}-${{ matrix.python-version }}.xml" \
              -o junit_family=legacy \
              -q
          done

      - name: Upload compatibility evidence
        if: needs.changes.outputs.test_mode != 'docs' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-compatibility-${{ matrix.python-version }}
          path: |
            test-lane-*-${{ matrix.python-version }}.json
            junit-*-${{ matrix.python-version }}.xml
          if-no-files-found: error

  coverage:
    name: Combined Python coverage
    needs: [changes, test]
    uses: ./.github/workflows/quality-coverage.yml
    with:
      test_mode: ${{ needs.changes.outputs.test_mode }}

  rust:
    name: Build Rust extension
    needs: changes
    uses: ./.github/workflows/quality-native.yml
    with:
      heavy_ci: ${{ needs.changes.outputs.heavy_ci }}

  benchmark-001:
    name: Benchmark 001 acceptance
    needs: changes
    uses: ./.github/workflows/quality-benchmark.yml
    with:
      heavy_ci: ${{ needs.changes.outputs.heavy_ci }}

  generated-board-release-gate:
    name: Generated board release gate
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip generated-board gate for non-heavy PR
        if: needs.changes.outputs.heavy_ci != 'true'
        run: |
          echo "Non-heavy PR; skipping generated-board release gate."
          echo "Non-heavy PR; generated-board release gate skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
        if: needs.changes.outputs.heavy_ci == 'true'

      - name: Set up locked Python
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run generated-board release gate
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_generated_board_release_gate.py \
            --output generated-board-release-gate.json \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --risky-package-reviewed \
            --risky-package-approval-id "GENERATED-BOARD-BASELINE-REVIEW-2026-07-22" \
            --strict

      - name: Upload generated-board release gate report
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: generated-board-release-gate
          path: generated-board-release-gate.json

      - name: Validate physical reference-board plan
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_physical_validation_plan.py \
            --plan benchmarks/esp32_usb_sensor/physical-validation-plan.json \
            --output physical-validation-plan-gate.json \
            --markdown physical-validation-plan-gate.md \
            --strict
          cat physical-validation-plan-gate.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload physical validation plan gate
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: physical-validation-plan-gate
          path: |
            physical-validation-plan-gate.json
            physical-validation-plan-gate.md

  docker-image-smoke:
    name: Docker image smoke
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Skip Docker smoke for non-heavy PR
        if: needs.changes.outputs.heavy_ci != 'true'
        run: |
          echo "Non-heavy PR; skipping Docker image smoke."
          echo "Non-heavy PR; Docker image smoke skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
        if: needs.changes.outputs.heavy_ci == 'true'

      # Shared hosted runners can exhaust Docker Hub's anonymous pull limit.
      # OCI digest pins are unchanged when resolving the base through a mirror.
      - name: Configure digest-pinned mirrored BuildKit
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4
        with:
          name: zaptrace-ci-mirror
          driver-opts: |
            image=mirror.gcr.io/moby/buildkit@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Exercise Compose REST and MCP runtimes
        if: needs.changes.outputs.heavy_ci == 'true'
        env:
          BUILDX_BUILDER: zaptrace-ci-mirror
        run: python3 scripts/ci_compose_smoke.py

      - name: Upload Compose smoke evidence
        if: always() && needs.changes.outputs.heavy_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: compose-runtime-smoke
          path: artifacts/compose-smoke/
          if-no-files-found: error
          retention-days: 14

  kicad-oracle:
    name: KiCad Oracle
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip KiCad oracle for non-heavy PR
        if: needs.changes.outputs.heavy_ci != 'true'
        run: |
          echo "Non-heavy PR; skipping KiCad oracle."
          echo "Non-heavy PR; KiCad oracle skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
        if: needs.changes.outputs.heavy_ci == 'true'

      - name: Set up locked Python
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run shared KiCad oracle checks
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: ./.github/actions/kicad-oracle
        with:
          run-jobset: "true"
        env:
          ZAPTRACE_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Run KiCad benchmark corpus gate
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_kicad_task_runner.py             --task-dir benchmarks/kicad-task-v1             --project-dir tests/corpus/kicad             --json-out kicad-benchmark-corpus.json

      - name: Capture physical candidate readiness
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_physical_candidate_readiness.py \
            --output physical-candidate-readiness.json \
            --markdown physical-candidate-readiness.md \
            --require-kicad
          cat physical-candidate-readiness.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload KiCad oracle summary
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kicad-oracle-summary
          path: |
            kicad-oracle-summary.json
            kicad-jobset-oracle-summary.json
            kicad-review-exports/
            kicad-benchmark-corpus.json
          if-no-files-found: error

      - name: Upload physical candidate readiness
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: physical-candidate-readiness
          path: |
            physical-candidate-readiness.json
            physical-candidate-readiness.md
          if-no-files-found: error
          retention-days: 30

  build:
    name: Build package
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip package build for non-heavy PR
        if: needs.changes.outputs.heavy_ci != 'true'
        run: |
          echo "Non-heavy PR; skipping package build."
          echo "Non-heavy PR; package build skipped." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
        if: needs.changes.outputs.heavy_ci == 'true'

      - name: Set up locked Python
        if: needs.changes.outputs.heavy_ci == 'true'
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build package
        if: needs.changes.outputs.heavy_ci == 'true'
        run: uv build

      - name: Validate package inventory
        if: needs.changes.outputs.heavy_ci == 'true'
        run: |
          .venv/bin/python scripts/ci_package_inventory.py \
            --dist-dir dist \
            --output package-inventory.json \
            --strict

      - name: Upload package inventory
        if: needs.changes.outputs.heavy_ci == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: package-inventory
          path: package-inventory.json
          if-no-files-found: error

  docs-stale:
    name: Check stale docs
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Check MCP tools reference is up to date
        run: .venv/bin/python scripts/generate_mcp_docs.py --check

      - name: Check docs status-sync guard
        run: |
          .venv/bin/python scripts/ci_docs_status_sync.py \
            --output docs-status-sync.json

      - name: Upload docs status-sync report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: docs-status-sync
          path: docs-status-sync.json

      - name: Check evidence identity policy
        run: |
          .venv/bin/python scripts/ci_evidence_identity.py \
            --output evidence-identity-policy.json \
            --strict

      - name: Upload evidence identity policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: evidence-identity-policy
          path: evidence-identity-policy.json
          if-no-files-found: error

      - name: Check JSON Schema matches generated
        run: |
          .venv/bin/python -c "
          from zaptrace.core.parser import generate_json_schema, write_json_schema
          import json, sys
          from pathlib import Path
          generated = generate_json_schema()
          committed = json.loads(Path('docs/schemas/design-v1.json').read_text(encoding='utf-8'))
          if generated != committed:
              print('ERROR: docs/schemas/design-v1.json is stale. Run write_json_schema() to regenerate.')
              sys.exit(1)
          print('OK: JSON Schema is up to date')
          "

  release-gate-summary:
    name: Release gate summary
    runs-on: ubuntu-latest
    needs: [changes, validation-environment, distribution-clean-install, lint, mcp-compatibility, test-lane-policy, test, test-compatibility, coverage, rust, build, docs-stale, benchmark-001, generated-board-release-gate, kicad-oracle, docker-image-smoke]
    if: always()
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: ./.github/actions/setup-locked-python
        with:
          uv-version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generate snapshot gate summary
        run: |
          .venv/bin/python scripts/ci_release_gate.py \
            --mode snapshot \
            --gate "validation-environment=${{ needs.validation-environment.result }}" \
            --gate "distribution-clean-install=${{ needs.distribution-clean-install.result }}" \
            --gate "lint=${{ needs.lint.result }}" \
            --gate "mcp-compatibility=${{ needs.mcp-compatibility.result }}" \
            --gate "test-lane-policy=${{ needs.test-lane-policy.result }}" \
            --gate "tests=${{ needs.test.result }}" \
            --gate "test-compatibility=${{ needs.test-compatibility.result }}" \
            --gate "coverage=${{ needs.coverage.result }}" \
            --gate "rust=${{ needs.rust.result }}" \
            --gate "build=${{ needs.build.result }}" \
            --gate "docs-stale=${{ needs.docs-stale.result }}" \
            --gate "benchmark-001=${{ needs.benchmark-001.result }}" \
            --gate "generated-board-release-gate=${{ needs.generated-board-release-gate.result }}" \
            --gate "kicad-oracle=${{ needs.kicad-oracle.result }}" \
            --gate "docker-image-smoke=${{ needs.docker-image-smoke.result }}" \
            --required-oracle "kicad-oracle" \
            --output snapshot-gate-summary.json \
            --markdown "$GITHUB_STEP_SUMMARY" \
            --strict

      - name: Upload release gate summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: snapshot-gate-summary
          path: snapshot-gate-summary.json
