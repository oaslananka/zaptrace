[project]
name = "zaptrace-eda"
version = "0.3.6.dev0"
description = "Agent-native electronics design core"
requires-python = ">=3.14.8"
license = {text = "PolyForm-Noncommercial-1.0.0"}
readme = "README.md"
keywords = ["electronics", "eda", "pcb", "mcp", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "anyio>=4.15.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "click>=8.5.0",
    "rich>=15.0.0",
    "Pillow>=12.3.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/oaslananka/zaptrace"
Repository = "https://github.com/oaslananka/zaptrace"
Issues = "https://github.com/oaslananka/zaptrace/issues"
Documentation = "https://oaslananka.github.io/zaptrace"
Changelog = "https://github.com/oaslananka/zaptrace/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mcp = ["fastmcp>=4.0.10,<5", "mcp>=2.2.0,<3"]
server = ["fastapi>=0.142.1", "uvicorn>=0.54.0", "httpx>=0.28.1", "cryptography>=50.0.1", "starlette>=1.7.0"]
all = ["fastmcp>=4.0.10,<5", "mcp>=2.2.0,<3", "fastapi>=0.142.1", "uvicorn>=0.54.0", "httpx>=0.28.1", "cryptography>=50.0.1", "starlette>=1.7.0"]

[project.scripts]
zaptrace = "zaptrace.cli.main:cli"
zaptrace-mcp = "zaptrace.mcp.server:run"
zaptrace-mcp-http = "zaptrace.mcp.server:run_http"
zaptrace-api = "zaptrace.api.server:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zaptrace"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "data"

[tool.hatch.build.targets.sdist.force-include]
"data" = "data"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E","W","F","I","UP","N","ANN","B","SIM"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"zaptrace/erc/rules.py" = ["N802"]
"zaptrace/ee/drc/engine.py" = ["N806"]
"zaptrace/ee/footprints.py" = ["N806"]
"zaptrace/export/gerber.py" = ["N806"]
"zaptrace/export/svg.py" = ["N806"]
"scripts/generate_library_expansion.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q --strict-markers"
asyncio_mode = "auto"
markers = [
    "unit: default fast unit-test lane",
    "integration: cross-module and service-contract lane",
    "benchmark: deterministic benchmark and convergence lane",
    "hardware: EDA format and generated-hardware lane",
    "external_tool: tests that delegate to Docker, KiCad, ngspice, or another installed tool",
    "native: tests requiring or validating the Rust native boundary",
    "corpus: tests that exercise committed interoperability corpora",
    "slow: tests outside the bounded fast-feedback lanes",
    "rust: compatibility alias for native-extension tests",
    "asyncio: asynchronous test coroutines",
]
filterwarnings = [
    "ignore:Using .*httpx.* with .*starlette.testclient.* is deprecated.*",
]

[tool.pyright]
include = ["zaptrace"]
exclude = ["**/__pycache__"]
pythonVersion = "3.12"
reportMissingModuleSource = false
venvPath = "."
venv = ".venv"

[tool.coverage.run]
source = ["zaptrace"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 75

[tool.maturin]
manifest-path = "zaptrace_core/Cargo.toml"
module-name = "zaptrace._core"
python-source = "."
include = [{ path = "data/**/*", format = ["wheel", "sdist"] }]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.9.0",
    "maturin>=1.15.0",
]
lint = [
    "ruff>=0.9.0",
]
typecheck = [
    "pyright>=1.1.414",
]
test = [
    "hypothesis>=6.156.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
