name: SHT31-DIS-B2.5kS
category: sensor
manufacturer: Sensirion
mpn: SHT31-DIS-B2.5kS
description: Digital humidity and temperature sensor with I2C interface in open-cavity DFN-8-1EP package
datasheet: https://sensirion.com/media/documents/213E6A3B/63A5A569/Datasheet_SHT3x_DIS.pdf
package: DFN-8-1EP
footprint: SHT31-DIS-DFN8
lifecycle: active
voltage_supply: 2.15-5.5 V
pins:
  SDA:
    type: bidirectional
    description: Serial data input/output
  ADDR:
    type: input
    description: I2C address select; connect to logic high or low and do not leave floating
  ALERT:
    type: output
    description: Programmable alert output; may be left floating when unused
  SCL:
    type: bidirectional
    description: Serial clock input/output
  VDD:
    type: power
    description: Supply voltage input, 2.15-5.5 V
  nRESET:
    type: input
    description: Active-low reset input; hold high when unused
  R:
    type: passive
    description: Reserved pin with no electrical function; connect to VSS
  VSS:
    type: power
    description: Ground; package pin 8 and exposed die pad 9 are internally common
package_pin_map:
  '1': SDA
  '2': ADDR
  '3': ALERT
  '4': SCL
  '5': VDD
  '6': nRESET
  '7': R
  '8': VSS
  '9': VSS
