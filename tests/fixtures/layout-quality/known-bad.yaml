meta:
  name: LayoutQualityBad
board:
  width_mm: 50
  height_mm: 40
  layers: 2
board_def:
  width: 50
  height: 40
  layers: 2
components:
  u1:
    ref: U1
    type: mcu
    footprint: QFN-32
    properties:
      power_w: 1.0
      theta_ja_c_per_w: 60
  c1:
    ref: C1
    type: capacitor
    value: 100nF
    footprint: "0402"
  j1:
    ref: J1
    type: usb-c connector
    footprint: USB-C
  u2:
    ref: U2
    type: sensor
    footprint: LGA-8
nets:
  vdd:
    name: VDD_3V3
    type: power
    constraints:
      is_high_current: true
      min_trace_width_mm: 0.8
    nodes: [U1.VCC, C1.1, U2.VDD]
  gnd:
    name: GND
    type: ground
    nodes: [U1.GND, C1.2, J1.GND, U2.GND]
  usb_dp:
    name: USB_D+
    type: differential
    constraints:
      length_match_group: USB
      diff_pair_partner: usb_dn
    nodes: [U1.DP, J1.DP]
  usb_dn:
    name: USB_D-
    type: differential
    constraints:
      length_match_group: USB
      diff_pair_partner: usb_dp
    nodes: [U1.DN, J1.DN]
constraints:
  placement:
    - component: C1
      near: U1
      max_distance_mm: 5
      reason: decoupling loop
    - component: J1
      edge: bottom
      reason: external connector
  routing:
    - net: USB_D*
      differential_pair: true
      impedance_ohm: 90
      length_match_mm: 0.5
      reason: USB full-speed pair
placement:
  u1: [25, 20]
  c1: [4, 35]
  j1: [25, 20]
  u2: [26, 20]
routing:
  traces:
    - {net_id: vdd, layer: F.Cu, start: [4, 35], end: [25, 20], width: 0.1}
    - {net_id: usb_dp, layer: F.Cu, start: [25, 20], end: [25, 2], width: 0.15}
    - {net_id: usb_dn, layer: F.Cu, start: [26, 20], end: [38, 2], width: 0.15}
