meta:
  name: LayoutQualityGood
board:
  width_mm: 50
  height_mm: 40
  layers: 2
board_def:
  width: 50
  height: 40
  layers: 2
  mounting_holes:
    - {position: [4, 4], diameter: 3.0}
    - {position: [46, 4], diameter: 3.0}
    - {position: [4, 36], diameter: 3.0}
    - {position: [46, 36], diameter: 3.0}
components:
  u1:
    ref: U1
    type: mcu
    footprint: QFN-32
  c1:
    ref: C1
    type: capacitor
    value: 100nF
    footprint: "0402"
  j1:
    ref: J1
    type: usb-c connector
    footprint: USB-C
  j2:
    ref: J2
    type: swd_header
    footprint: 2x5-header
  tp1:
    ref: TP1
    type: testpoint
    footprint: TestPoint
nets:
  vdd:
    name: VDD_3V3
    type: power
    constraints:
      is_high_current: true
      min_trace_width_mm: 0.8
      return_path_net: gnd
    nodes: [U1.VCC, C1.1, TP1.1]
  gnd:
    name: GND
    type: ground
    nodes: [U1.GND, C1.2, J1.GND, J2.GND]
  usb_dp:
    name: USB_D+
    type: differential
    constraints:
      impedance_target: 90
      length_match_group: USB
      diff_pair_partner: usb_dn
      return_path_net: gnd
    nodes: [U1.DP, J1.DP]
  usb_dn:
    name: USB_D-
    type: differential
    constraints:
      impedance_target: 90
      length_match_group: USB
      diff_pair_partner: usb_dp
      return_path_net: gnd
    nodes: [U1.DN, J1.DN]
  swdio:
    name: SWDIO
    type: data
    nodes: [U1.SWDIO, J2.SWDIO]
  swclk:
    name: SWCLK
    type: clock
    nodes: [U1.SWCLK, J2.SWCLK]
  nrst:
    name: NRST
    type: signal
    nodes: [U1.NRST, J2.NRST]
constraints:
  placement:
    - component: C1
      near: U1
      max_distance_mm: 5
      reason: decoupling loop
    - component: J1
      edge: bottom
      reason: external connector
  routing:
    - net: USB_D*
      differential_pair: true
      impedance_ohm: 90
      length_match_mm: 0.5
      reason: USB full-speed pair
placement:
  u1: [25, 20]
  c1: [26, 20]
  j1: [25, 1]
  j2: [5, 20]
  tp1: [22, 20]
routing:
  traces:
    - {net_id: vdd, layer: F.Cu, start: [22, 20], end: [26, 20], width: 1.0}
    - {net_id: usb_dp, layer: F.Cu, start: [25, 19], end: [25, 1], width: 0.2}
    - {net_id: usb_dn, layer: F.Cu, start: [26, 19], end: [26, 1], width: 0.2}
    - {net_id: gnd, layer: B.Cu, start: [5, 20], end: [46, 20], width: 0.5}
