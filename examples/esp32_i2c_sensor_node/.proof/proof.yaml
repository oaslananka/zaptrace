# proof.yaml — ESP32 I2C Sensor Node Proof Pack
version: "1.0"
name: "esp32-sensor-node"
description: "Detects design-rule and routing risks; passing checks never certify fabrication readiness"

design_path: "../design.yaml"

model:
  min_clearance_mm: 0.15
  min_trace_width_mm: 0.15
  min_annular_ring_mm: 0.05
  max_layer_count: 2
  allowed_layer_counts: [2]

checks:
  - name: "drc-clean"
    description: "Zero DRC violations"
    category: drc
    type: drc
    severity: critical
    expected_count: 0

  - name: "erc-clean"
    description: "Zero ERC violations"
    category: erc
    type: erc
    severity: critical
    expected_count: 0

  - name: "all-nets-routed"
    description: "All nets fully routed"
    category: routing
    type: routed
    severity: critical

  - name: "min-clearance"
    description: "Verify minimum 0.15mm clearance"
    category: routing
    type: clearance
    severity: error
    params:
      min_clearance_mm: 0.15

  - name: "footprints-complete"
    description: "All components have footprints assigned"
    category: footprint
    type: footprint_exists
    severity: error

  - name: "physical-pads-mapped"
    description: "All logical net nodes have actual footprint pad geometry"
    category: footprint
    type: footprint_pads_mapped
    severity: critical

  - name: "power-nets-connected"
    description: "Power nets have expected connections"
    category: custom
    type: net_connected
    severity: critical
    params:
      net_name: "VCC_3V3"
      expected_pins:
        - "U3.OUTPUT"
        - "U1.VCC"
        - "U1.EN"
        - "U2.VDD"
        - "U2.VDDIO"
        - "U2.CSB"
        - "C1.P1"
        - "C2.P1"
        - "R1.P1"
        - "R2.P1"

  - name: "gnd-connected"
    description: "GND net has expected connections"
    category: custom
    type: net_connected
    severity: critical
    params:
      net_name: "GND"
      expected_pins:
        - "J1.GND"
        - "U3.GND"
        - "U1.GND"
        - "U2.GND"
        - "U2.SDO"
        - "C1.P2"
        - "C2.P2"
        - "C3.P2"
        - "D1.GND"
        - "R3.P2"
        - "R4.P2"

author: "ZapTrace Core Team"
tags: ["esp32", "sensor", "jlcpcb", "example"]
requires: ["zaptrace>=0.2.0"]
