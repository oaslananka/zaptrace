    value: GND boundary
    footprint: TestPoint_Pad_1.0mm
    footprint_asset: testpoint-pad-d1
    pins:
      P1:
        type: power
        net: GND
    package_pin_map:
      '1': P1
  U3:
    id: U3
    ref: U3
    type: TPSM82901
    value: TPSM82901SISR
    mpn: TPSM82901SISR
    manufacturer: Texas Instruments
    footprint: TPSM82901
    datasheet_url: https://www.ti.com/lit/ds/symlink/tpsm82901.pdf
    voltage_supply: 3.0-17V
    current_rating: 1.0
    properties:
      candidate_status: review-only
      package: SIS0011A MicroSiP 11-pin
      vout_nominal_v: 3.322
      switching_frequency_hz: 2500000
      mode: Auto PFM/PWM with AEE
      reference_design: TI TPSM82901EVM BSR188-001
      land_pattern_status: DRAFT; perimeter pad dimensions and center thermal land
        reconciled to TI example drawing; stencil split is approximate; optional thermal
        vias not yet added
      fb_mode: external feedback
      vout_calculated_v: 3.322892
      mode_setting: '7.15k to GND: 2.5MHz Auto PFM/PWM with AEE; output discharge
        disabled'
      sw_nc_pad: '8: intentionally unconnected'
      exposed_ground_pad: '11: solder to common ground plane'
      thermal_layout_status: four copper layers with GND reference zones, local VIN/VOUT
        copper, GND stitching vias and one extra GND via at (20.0, 15.8) adjacent
        to exposed pad 11; via is outside the EP land/paste aperture; optional 0.2
        mm via-in-pad pattern omitted pending assembly definition; copper weight is
        unspecified; not thermally qualified
      placement_status: compact first-pass aligned to TI layout example; detailed
        current loops/EMI/thermal acceptance still open
      power_budget_status: 1 A is converter rating, not available USB-C board current;
        5 V input budget and Type-C source current advertisement are not measured
        or monitored; effective input/output capacitance under DC bias and temperature
        remains to be qualified
    package_pin_map:
      '1': VIN_A
      '2': VIN_B
      '3': EN
      '4': MODE_SCONF
      '5': SS_TR
      '6': PG
      '7': FB_VSET
      '8': SW_NC
      '9': VOUT_A
      '10': VOUT_B
      '11': GND
    pins:
      VIN_A:
        type: power
        net: VCC_5V
      VIN_B:
        type: power
        net: VCC_5V
      EN:
        type: input
        net: VCC_5V
      MODE_SCONF:
        type: input
        net: MODE_CFG
      SS_TR:
        type: input
        net: SS_NODE
      PG:
        type: output
        net: PG_NODE
      FB_VSET:
        type: input
        net: FB_NODE
      SW_NC:
        type: no_connect
      VOUT_A:
        type: output
        net: VCC_3V3
      VOUT_B:
        type: output
        net: VCC_3V3
      GND:
        type: power
        net: GND
