    footprint: TestPoint_Pad_1.0mm
    footprint_asset: testpoint-pad-d1
    pins:
      P1:
        type: power
        net: VCC_5V
    package_pin_map:
      '1': P1
  TP_OUT:
    id: TP_OUT
    ref: TP_OUT
