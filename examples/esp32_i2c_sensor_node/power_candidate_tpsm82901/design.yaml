    footprint: zaptrace:C_0603_SS_Rev
    package_pin_map:
      '1': P1
      '2': P2
    pins:
      P1:
        type: passive
        net: SS_NODE
      P2:
        type: passive
        net: GND
  R4:
    id: R4
    ref: R4
    type: R_0603_1608Metric
    value: 1M 1% (EVM PG pull-up)
    footprint: '0603'
