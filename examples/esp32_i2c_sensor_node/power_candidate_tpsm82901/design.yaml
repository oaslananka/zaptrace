    footprint: TestPoint_Pad_1.0mm
    footprint_asset: testpoint-pad-d1
    pins:
      P1:
        type: power
        net: VCC_3V3
    package_pin_map:
      '1': P1
  TP_GND:
    id: TP_GND
    ref: TP_GND
