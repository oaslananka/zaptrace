meta:
  name: ESP32 Sensor Node — TPSM82901 Review-Only Power Stage
  version: 0.1.0-review-only
  description: Four-layer isolated TPSM82901SISR candidate with TI package land dimensions,
    EVM values, compact passive placement and first-pass current/thermal copper topology.
    Not yet electrically, EMI or thermally qualified.
  tags:
  - power
  - buck
  - tpsm82901
  - review-only
  - not-for-fabrication
board:
  width_mm: 40
  height_mm: 30
  layers: 4
placement:
  TP_IN:
  - 3
  - 12
  TP_OUT:
  - 37
  - 12
  TP_GND:
  - 20
  - 27
  U3:
  - 20
  - 14
  C1:
  - 16.4
  - 12.8
  C2:
  - 23.0
  - 12.8
  R1:
  - 26.0
  - 14.0
  R2:
  - 25.0
  - 17.0
  R3:
  - 17.2
  - 14.5
  C3:
  - 22.5
  - 16.5
  C4:
  - 17.2
  - 16.5
  R4:
  - 26.5
  - 18.5
components:
  TP_IN:
    id: TP_IN
    ref: TP_IN
    type: TESTPOINT
