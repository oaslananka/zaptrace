        type: passive
        net: GND
      P2:
        type: passive
        net: VCC_5V
  C2:
    id: C2
    ref: C2
    type: C_0805_2012Metric
    value: 22uF 10V X7S TDK C2012X7S1A226M125AC
    footprint: 0805
    package_pin_map:
      '1': P1
      '2': P2
    pins:
      P1:
        type: passive
        net: VCC_3V3
      P2:
        type: passive
        net: GND
  R1:
    id: R1
    ref: R1
    type: R_0603_1608Metric
    value: 113k 1%
    footprint: '0603'
    package_pin_map:
      '1': P1
      '2': P2
    pins:
      P1:
        type: passive
        net: VCC_3V3
      P2:
        type: passive
        net: FB_NODE
  R2:
    id: R2
    ref: R2
    type: R_0603_1608Metric
    value: 24.9k 1%
    footprint: '0603'
    package_pin_map:
      '1': P1
      '2': P2
    pins:
      P1:
        type: passive
        net: FB_NODE
      P2:
        type: passive
        net: GND
  R3:
    id: R3
    ref: R3
    type: R_0603_Mode_Rev
    value: 7.15k 1%
    footprint: zaptrace:R_0603_Mode_Rev
    package_pin_map:
      '1': P1
      '2': P2
    pins:
      P1:
        type: passive
        net: MODE_CFG
      P2:
        type: passive
        net: GND
  C3:
    id: C3
    ref: C3
    type: C_0603_1608Metric
    value: 22pF C0G (EVM optional feed-forward)
    footprint: '0603'
    package_pin_map:
      '1': P1
      '2': P2
    pins:
      P1:
        type: passive
        net: VCC_3V3
      P2:
        type: passive
        net: FB_NODE
  C4:
