meta:
  name: "ESP32 I2C Sensor Board"
  version: "0.1.0"
  description: "ESP32-WROOM-32 with BME280 temperature/humidity/pressure sensor via I2C"
  tags: ["esp32", "i2c", "sensor", "bme280", "wifi", "ble"]

board:
  width_mm: 50
  height_mm: 40
  layers: 2

components:
  U1:
    id: "U1"
    ref: "U1"
    type: "ESP32-WROOM-32"
    footprint: "ESP32-WROOM-32"
    footprint_asset: "esp32-wroom-32"
    # Official Espressif ESP32-WROOM-32 physical module pad numbers.
    # The pinned module pad geometry is loaded; full board review is still required.
    package_pin_map:
      "1": "GND"
      "2": "VCC"
      "3": "EN"
      "15": "GND"
      "33": "GPIO21"
      "36": "GPIO22"
      "38": "GND"
      "39": "GND"
    pins:
      GND:    {type: "power",   net: "GND"}
      VCC:    {type: "power",   net: "VCC_3V3"}
      EN:     {type: "input",   net: "VCC_3V3"}
      GPIO21: {type: "bidirectional", net: "I2C_SDA"}
      GPIO22: {type: "bidirectional", net: "I2C_SCL"}
  U2:
    id: "U2"
    ref: "U2"
    type: "BME280"
    footprint: "LGA-8"
    footprint_asset: "bme280-lga8"
    # Bosch BME280 datasheet Table 35; GPIO 'SDA' uses physical SDI pad 3.
    package_pin_map:
      "1": "GND"
      "2": "CSB"
      "3": "SDA"
      "4": "SCK"
      "5": "SDO"
      "6": "VDDIO"
      "7": "GND"
      "8": "VDD"
    pins:
      VDD:  {type: "power",   net: "VCC_3V3"}
      VDDIO: {type: "power", net: "VCC_3V3"}
      GND:  {type: "power",   net: "GND"}
      SDA:  {type: "bidirectional", net: "I2C_SDA"}
      SCK:  {type: "input",   net: "I2C_SCL"}
      CSB:  {type: "input",   net: "VCC_3V3"}
      SDO:  {type: "input",   net: "GND"}
  U3:
    id: "U3"
    ref: "U3"
    type: "AMS1117-3.3"
    footprint: "SOT-223"
    footprint_asset: "ams1117-sot223-tabpin2"
    # Fixed-version Advanced Monolithic Systems AMS1117 SOT-223 pinout:
    # pad 1 GND, pad 2 VOUT (including metal heatsink tab), pad 3 VIN.
    # Real package geometry does not qualify a specific production lot.
    package_pin_map:
      "1": "GND"
      "2": "OUTPUT"
      "3": "INPUT"
    pins:
      INPUT:  {type: "power",   net: "VCC_5V"}
      OUTPUT: {type: "output",  net: "VCC_3V3"}
      GND:    {type: "power",   net: "GND"}
  R1:
    id: "R1"
    ref: "R1"
    type: "RES"
    value: "4.7k"
    footprint: "0402"
    footprint_asset: "r-0402"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "VCC_3V3"}
      P2: {type: "passive", net: "I2C_SDA"}
  R2:
    id: "R2"
    ref: "R2"
    type: "RES"
    value: "4.7k"
    footprint: "0402"
    footprint_asset: "r-0402"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "VCC_3V3"}
      P2: {type: "passive", net: "I2C_SCL"}
  C1:
    id: "C1"
    ref: "C1"
    type: "CAP"
    value: "100nF"
    footprint: "0402"
    footprint_asset: "c-0402"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "VCC_3V3"}
      P2: {type: "passive", net: "GND"}
  C2:
    id: "C2"
    ref: "C2"
    type: "CAP"
    value: "10uF"
    footprint: "0805"
    footprint_asset: "c-0805"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "VCC_3V3"}
      P2: {type: "passive", net: "GND"}
  J1:
    id: "J1"
    ref: "J1"
    type: "USB-C-16P"
    footprint: "USB-C-16P-SMD"
    footprint_asset: "usb4105-16p"
    # GCT USB4105 actual contact IDs; S1 shell mounts are mechanically
    # separate from the USB GND contacts until EMI/chassis policy is reviewed.
    # The 4 plated oval S1 slots and 2 NPTH pegs are preserved geometrically.
    package_pin_map:
      "A1": "GND"
      "A4": "VBUS"
      "A5": "CC1"
      "A9": "VBUS"
      "A12": "GND"
      "B1": "GND"
      "B4": "VBUS"
      "B5": "CC2"
      "B9": "VBUS"
      "B12": "GND"
    pins:
      VBUS: {type: "power",   net: "VCC_5V"}
      GND:  {type: "power",   net: "GND"}
      CC1:  {type: "passive", net: "USB_CC1"}
      CC2:  {type: "passive", net: "USB_CC2"}

  # Fixed USB-C 5 V sink: each CC contact requires an INDEPENDENT 5.1k Rd
  # to ground. These logical nets do not certify physical routing or PD.
  R3:
    id: "R3"
    ref: "R3"
    type: "RES"
    value: "5.1k"
    footprint: "0402"
    footprint_asset: "r-0402"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "USB_CC1"}
      P2: {type: "passive", net: "GND"}
  R4:
    id: "R4"
    ref: "R4"
    type: "RES"
    value: "5.1k"
    footprint: "0402"
    footprint_asset: "r-0402"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "USB_CC2"}
      P2: {type: "passive", net: "GND"}

  C3:
    id: "C3"
    ref: "C3"
    type: "CAP"
    value: "100nF"
    footprint: "0402"
    footprint_asset: "c-0402"
    package_pin_map:
      "1": "P1"
      "2": "P2"
    pins:
      P1: {type: "passive", net: "VCC_5V"}
      P2: {type: "passive", net: "GND"}
  D1:
    id: "D1"
    ref: "D1"
    type: "PESD5V0S1BA"
    value: "PESD5V0S1BA"
    footprint: "D_SOD-323"
    footprint_asset: "pesd5v0s1ba-sod323"
    # Nexperia product datasheet v6 (2024-04-26), SOD323, K1/K2,
    # bidirectional device; either polarity is electrically equivalent.
    # Illustrative ESD candidate only: VBUS standoff/surge/thermals and
    # connector proximity require qualification for a production PCB.
    package_pin_map:
      "1": "IO"
      "2": "GND"
    pins:
      IO:  {type: "passive", net: "VCC_5V"}
      GND: {type: "passive", net: "GND"}
  TP1:
    id: "TP1"
    ref: "TP1"
    type: "TESTPOINT"
    footprint: "TestPoint_Pad_1.0mm"
    footprint_asset: "testpoint-pad-d1"
    package_pin_map:
      "1": "P1"
    pins:
      P1: {type: "passive", net: "I2C_SDA"}
  TP2:
    id: "TP2"
    ref: "TP2"
    type: "TESTPOINT"
    footprint: "TestPoint_Pad_1.0mm"
    footprint_asset: "testpoint-pad-d1"
    package_pin_map:
      "1": "P1"
    pins:
      P1: {type: "passive", net: "I2C_SCL"}

nets:
  VCC_5V:    {id: "VCC_5V",   name: "VCC_5V",   type: "power",  nodes: ["J1.VBUS","U3.INPUT","C3.P1","D1.IO"]}
  VCC_3V3:   {id: "VCC_3V3",  name: "VCC_3V3",  type: "power",  nodes: ["U3.OUTPUT","U1.VCC","U1.EN","U2.VDD","U2.VDDIO","U2.CSB","C1.P1","C2.P1","R1.P1","R2.P1"]}
  GND:       {id: "GND",      name: "GND",       type: "ground", nodes: ["J1.GND","U3.GND","U1.GND","U2.GND","U2.SDO","C1.P2","C2.P2","C3.P2","D1.GND","R3.P2","R4.P2"]}
  USB_CC1:   {id: "USB_CC1", name: "USB_CC1", type: "data", nodes: ["J1.CC1","R3.P1"]}
  USB_CC2:   {id: "USB_CC2", name: "USB_CC2", type: "data", nodes: ["J1.CC2","R4.P1"]}
  I2C_SDA:   {id: "I2C_SDA",  name: "I2C_SDA",  type: "data",   nodes: ["U1.GPIO21","U2.SDA","R1.P2","TP1.P1"]}
  I2C_SCL:   {id: "I2C_SCL",  name: "I2C_SCL",  type: "clock",  nodes: ["U1.GPIO22","U2.SCK","R2.P2","TP2.P1"]}

copper_pours:
  gnd_top:
    layer: F.Cu
    net_id: GND
    polygon: [[2, 2], [48, 2], [48, 38], [2, 38]]
