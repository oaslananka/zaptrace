# Mergify Configuration for zaptrace
# https://docs.mergify.com

merge_queue:
  mode: serial
  max_parallel_checks: 1
  queued_label: queued
  dequeued_label: dequeued
  status_comments: all
  reset_on_external_merge: always

queue_rules:
  - name: default
    merge_method: squash
    batch_size: 1
    checks_timeout: 90 min
    branch_protection_injection_mode: queue
    queue_conditions:
      - check-success = Release gate summary
      - check-success = Security gate
      - check-success = Repository hooks
      - check-success = Repository hygiene
      - check-success = Dependency review
      - check-success = Container security gate
    merge_conditions:
      - check-success = Release gate summary
      - check-success = Security gate
      - check-success = Repository hooks
      - check-success = Repository hygiene
      - check-success = Dependency review
      - check-success = Container security gate


pull_request_rules:
  # Workflow Automation remains the merge-admission path even when the
  # separate Merge Protections product is not enabled for this repository.
  - name: queue verified low-risk Renovate updates
    conditions:
      - base = main
      - author = renovate[bot]
      - label = automerge:enabled
      # A complete CI suite must not override Renovate's release-age cooldown.
      # Apply this only to the bot auto-queue path, not explicit human queueing.
      - check-success = renovate/stability-days
      - -draft
      - -conflict
      - -label = automerge:disabled
      - -label = do-not-merge
      - -label = hold
      - -label = status/needs-review
      - -label = risk:high
      - -label = runtime-risk
      - -label = security
      - -label = area/security
      - '-files ~= ^\.github/'
      - '-files ~= ^Dockerfile'
      - '-files ~= (^|/)docker-compose(?:\.[^.]+)?\.ya?ml'
      - '-files ~= ^\.mergify\.ya?ml'
      - check-success = Release gate summary
      - check-success = Security gate
      - check-success = Repository hooks
      - check-success = Repository hygiene
      - check-success = Dependency review
      - check-success = Container security gate
    actions:
      queue:
        name: default

  - name: automatic merge on CI success
    conditions:
      - base = main
      - check-success = Release gate summary
      - check-success = Security gate
      - check-success = Repository hooks
      - check-success = Repository hygiene
      - check-success = Dependency review
      - check-success = Container security gate
      - label = ready-to-merge
    actions:
      queue:
        name: default

  - name: add to queue when labeled
    conditions:
      - base = main
      - label = queue-me
    actions:
      queue:
        name: default

  - name: label CI failure
    conditions:
      - or:
          - check-failure = Release gate summary
          - check-failure = Security gate
          - check-failure = Repository hooks
          - check-failure = Repository hygiene
          - check-failure = Dependency review
          - check-failure = Container security gate
    actions:
      label:
        add:
          - ci-failed
